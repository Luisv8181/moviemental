name: Deploy Moviemental to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - 'features/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Verify static site files
        run: |
          test -f index.html
          test -f assets/css/site.css
          test -f assets/js/app.js
          test -f data/index.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("data/index.json").read_text())
          for kind, paths in manifest.items():
              for item in paths:
                  if not Path(item).is_file():
                      raise SystemExit(f"Missing {kind} file: {item}")
          print("Manifest and referenced JSON files are present.")
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
